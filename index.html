<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimCity BuildIt — Store &amp; Item Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #070b14;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Visible Horizontal Slidebar for Store Row */
    .store-slidebar {
      scrollbar-width: thin;
      scrollbar-color: #38bdf8 #0f172a;
    }
    .store-slidebar::-webkit-scrollbar {
      height: 8px;
    }
    .store-slidebar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.85);
      border-radius: 999px;
      border: 1px solid rgba(30, 41, 59, 0.8);
    }
    .store-slidebar::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, #0284c7, #22d3ee);
      border-radius: 999px;
    }
    .store-slidebar::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(90deg, #0ea5e9, #67e8f9);
    }

    /* Seamless Store Artwork Presentation */
    .store-art-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .store-art-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), filter 0.25s ease;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.65));
    }
    .store-card:hover .store-art-img {
      transform: scale(1.07) translateY(-2px);
    }
    .store-card.is-active .store-art-img {
      transform: scale(1.06);
      filter: drop-shadow(0 10px 18px rgba(34, 211, 238, 0.3));
    }
    .store-fallback-badge {
      width: 100%;
      height: 100%;
      border-radius: 0.875rem;
      background: radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.16), rgba(15, 23, 42, 0.92) 75%);
      border: 1px solid rgba(51, 65, 85, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #67e8f9;
      letter-spacing: -0.02em;
    }

    /* Item Artwork Presentation */
    .item-art-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 0.75rem;
      background: radial-gradient(circle at 50% 45%, rgba(148, 163, 184, 0.12), rgba(2, 6, 23, 0.85) 80%);
      border: 1px solid rgba(30, 41, 59, 0.9);
      overflow: hidden;
    }
    .item-art-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.55));
      transition: transform 0.2s ease;
    }
    .item-card:hover .item-art-img {
      transform: scale(1.08);
    }
    .item-fallback-badge {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.75rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body class="min-h-screen selection:bg-cyan-400 selection:text-slate-950">

  <!-- Top Navigation & Controls -->
  <header class="bg-slate-900/90 border-b border-slate-800/80 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 py-3.5 space-y-3">

            SC
          </div>
          <div>
            <h1 class="text-base sm:text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
              Simcity BuildIt Inventory
            </h1>
          </div>
        </div>

        <!-- Global Store Star Level Toggle -->
        <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 self-start md:self-auto" id="starPills"></div>
      </div>

      <!-- Search Bar + Include Ingredients Checkbox + Category Filter -->
      <div class="flex flex-col lg:flex-row lg:items-center gap-2.5">
        <div class="flex flex-wrap items-center gap-2 flex-1">
          <div class="relative flex-1 min-w-[210px] max-w-md">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input
              type="text"
              id="searchInput"
              oninput="handleSearch(this.value)"
              placeholder="Search item name (e.g. Ice Cream, Donuts)..."
              class="w-full bg-slate-950 border border-slate-700/90 focus:border-cyan-400 rounded-xl pl-9 pr-8 py-1.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none transition"
            />
            <button
              id="clearSearchBtn"
              onclick="clearSearch()"
              class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs font-bold px-1"
              title="Clear search"
            >✕</button>
          </div>

          <!-- Include Ingredients Checkbox -->
          <label class="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 hover:border-slate-700 cursor-pointer select-none text-xs text-slate-300 transition">
            <input
              type="checkbox"
              id="includeIngredientsCb"
              onchange="toggleIngredientsSearch(this.checked)"
              class="w-3.5 h-3.5 rounded accent-cyan-400 cursor-pointer"
            />
            <span>Include ingredients</span>
          </label>
        </div>

        <div id="groupPills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="max-w-7xl mx-auto px-4 py-5 space-y-5">

    <!-- Swipeable / Slidebar Row of Commercial Stores -->
    <section aria-label="Commercial Stores Row" class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Commercial Stores</span>
          <span class="text-[11px] text-cyan-400/90 font-medium sm:hidden">← Swipe →</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="storeCount" class="text-xs text-slate-500 font-medium"></span>
          <div class="hidden sm:flex items-center gap-1">
            <button
              type="button"
              onclick="scrollStoreRow(-1)"
              aria-label="Scroll stores left"
              class="w-7 h-7 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-sm transition"
            >‹</button>
            <button
              type="button"
              onclick="scrollStoreRow(1)"
              aria-label="Scroll stores right"
              class="w-7 h-7 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-sm transition"
            >›</button>
          </div>
        </div>
      </div>

      <div
        id="storeList"
        class="store-slidebar flex items-stretch gap-3 overflow-x-auto pb-2.5 cursor-grab active:cursor-grabbing select-none"
      ></div>
    </section>

    <!-- Selected Store Banner + Producible Items Directly Below -->
    <section aria-label="Store Items" class="space-y-4">
      <div id="selectedStoreBanner"></div>
      <div id="itemGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </section>

  </main>

        ]
      },
      {
        id: "chocolate-factory",
        name: "Chocolate Factory",
        group: "Seasonal",
        unlockLv: 6,
        buildCost: "Free (Seasonal)",
        items: [
          { name: "Chocolate Bar", lv: 6, price: 0, mins: 0, mats: "Spring Seasonal • Verify stats" },
          { name: "Chocolate Eggs", lv: 6, price: 0, mins: 0, mats: "Spring Seasonal • Verify stats" },
          { name: "Fruit Jelly", lv: 6, price: 0, mins: 0, mats: "Spring Seasonal • Verify stats" },
          { name: "Easter Basket", lv: 6, price: 0, mins: 0, mats: "Spring Seasonal • Verify stats" }
        ]
      }
    ];

    let activeStar = 0;
    let activeGroup = "All";
    let selectedStoreId = STORES[0].id;
    let expandedItemKey = null;
    let searchQuery = "";
    let includeIngredients = false;
    let suppressNextStoreClick = false;

    function slugifyName(text) {
      return text
        .toLowerCase()
        .replace(/\(.*?\)/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function getInitials(label) {
      return label
        .replace(/\(.*?\)/g, "")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(w => w[0] || "")
        .join("")
        .toUpperCase();
    }

    function getStoreImageSrc(store) {
      return store.img ? store.img : `${STORE_IMG_DIR}/${store.id}.png`;
    }

    function getItemImageSrc(item) {
      return item.img ? item.img : `${ITEM_IMG_DIR}/${slugifyName(item.name)}.png`;
    }

    function renderStoreArtwork(store, sizeClass = "w-14 h-12", badgeTextClass = "text-xs") {
      const src = getStoreImageSrc(store);
      const initials = getInitials(store.name);
      return `
        <div class="store-art-wrap ${sizeClass}">
          <img
            src="${src}"
            alt="${store.name}"
            loading="lazy"
            draggable="false"
            class="store-art-img"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="store-fallback-badge ${badgeTextClass}" style="display: none;">${initials}</div>
        </div>
      `;
    }

    function renderItemArtwork(item, sizeClass = "w-12 h-12") {
      const src = getItemImageSrc(item);
      const initials = getInitials(item.name);
      return `
        <div class="item-art-wrap ${sizeClass}">
          <img
            src="${src}"
            alt="${item.name}"
            loading="lazy"
            draggable="false"
            class="item-art-img"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          />
          <div class="item-fallback-badge" style="display: none;">${initials}</div>
        </div>
      `;
    }

    function formatDuration(baseMins, reduction) {
      if (!baseMins || baseMins <= 0) return "—";
      const totalSeconds = Math.round(baseMins * (1 - reduction) * 60);
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      if (hrs > 0) {
        return secs > 0 ? `${hrs}h ${mins}m ${secs}s` : (mins > 0 ? `${hrs}h ${mins}m` : `${hrs}h`);
      }
      return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
    }

    function getAdjustedMins(baseMins, reduction) {
      return baseMins * (1 - reduction);
    }

    function itemMatches(item, q) {
      if (item.name.toLowerCase().includes(q)) return true;
      if (includeIngredients && item.mats.toLowerCase().includes(q)) return true;
      return false;
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      document.getElementById("clearSearchBtn").classList.toggle("hidden", searchQuery.length === 0);
      renderStores();
      renderItems();
    }

    function toggleIngredientsSearch(checked) {
      includeIngredients = checked;
      const input = document.getElementById("searchInput");
      input.placeholder = checked
        ? "Search item or ingredient (e.g. Glue, Flour)..."
        : "Search item name (e.g. Ice Cream, Donuts)...";
      if (searchQuery) {
        renderStores();
        renderItems();
      }
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      input.value = "";
      searchQuery = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      renderStores();
      renderItems();
    }

    function renderStarPills() {
      document.getElementById("starPills").innerHTML = STAR_LEVELS.map(st => {
        const active = st.id === activeStar;
        return `<button onclick="selectStar(${st.id})" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
          active ? "bg-amber-400 text-slate-950 shadow" : "text-slate-300 hover:text-white"
        }">${st.label}</button>`;
      }).join("");
    }

    function selectStar(starId) {
      activeStar = starId;
      renderStarPills();
      renderItems();
    }

    function getVisibleStores() {
      return activeGroup === "All" ? STORES : STORES.filter(s => s.group === activeGroup);
    }

    function renderGroupPills() {
      const groups = ["All", "Year-Round", "Regional", "Seasonal"];
      document.getElementById("groupPills").innerHTML = groups.map(g => {
        const active = g === activeGroup;
        return `<button onclick="selectGroup('${g}')" class="px-3 py-1 rounded-full text-xs font-medium border shrink-0 transition ${
          active ? "bg-cyan-400 text-slate-950 border-cyan-300 font-semibold" : "bg-slate-800 text-slate-300 border-slate-700 hover:border-slate-500"
        }">${g}</button>`;
      }).join("");
    }

    function selectGroup(group) {
      activeGroup = group;
      const visible = getVisibleStores();
      if (!visible.some(s => s.id === selectedStoreId) && visible.length) {
        selectedStoreId = visible[0].id;
      }
      expandedItemKey = null;
      renderGroupPills();
      renderStores();
      renderItems();
    }

    function selectStore(id, scrollIntoRow = false) {
      if (suppressNextStoreClick) {
        suppressNextStoreClick = false;
        return;
      }
      selectedStoreId = id;
      expandedItemKey = null;
      if (searchQuery) {
        clearSearch();
      } else {
        renderStores();
        renderItems();
      }
      if (scrollIntoRow) {
        const activeCard = document.querySelector(`[data-store-id="${id}"]`);
        if (activeCard) {
          activeCard.scrollIntoView({ behavior: "auto", inline: "center", block: "nearest" });
        }
      }
    }

    function scrollStoreRow(direction) {
      const row = document.getElementById("storeList");
      if (!row) return;
      const step = Math.max(260, Math.round(row.clientWidth * 0.75));
      row.scrollLeft += direction * step;
    }

    function initStoreRowDesktopControls() {
      const row = document.getElementById("storeList");
      if (!row) return;

      // Translate vertical wheel scroll into horizontal sliding over the row
      row.addEventListener("wheel", (e) => {
        if (row.scrollWidth > row.clientWidth) {
          const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
          if (delta !== 0) {
            e.preventDefault();
            row.scrollLeft += delta;
          }
        }
      }, { passive: false });

      // Click-and-drag horizontal sliding for laptop mouse/trackpad
      let isMouseDown = false;
      let startX = 0;
      let startScrollLeft = 0;
      let hasDragged = false;

      row.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        isMouseDown = true;
        hasDragged = false;
        startX = e.clientX;
        startScrollLeft = row.scrollLeft;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isMouseDown) return;
        const walk = e.clientX - startX;
        if (Math.abs(walk) > 6) {
          hasDragged = true;
        }
        if (hasDragged) {
          row.scrollLeft = startScrollLeft - walk * 1.2;
        }
      });

      window.addEventListener("mouseup", () => {
        if (!isMouseDown) return;
        isMouseDown = false;
        if (hasDragged) {
          suppressNextStoreClick = true;
          setTimeout(() => {
            suppressNextStoreClick = false;
          }, 0);
        }
      });
    }

    function toggleItem(key) {
      expandedItemKey = expandedItemKey === key ? null : key;
      renderItems();
    }

    function renderStores() {
      const visible = getVisibleStores();
      const q = searchQuery.toLowerCase();
      document.getElementById("storeCount").textContent = `${visible.length} shops`;

      document.getElementById("storeList").innerHTML = visible.map(store => {
        const isSelected = !q && store.id === selectedStoreId;
        const matchCount = q
          ? store.items.filter(it => itemMatches(it, q)).length
          : store.items.length;

        return `
          <button
            type="button"
            data-store-id="${store.id}"
            onclick="selectStore('${store.id}')"
            class="store-card ${isSelected ? "is-active" : ""} group relative overflow-hidden shrink-0 w-56 sm:w-64 text-left p-3 rounded-2xl border transition-all duration-200 flex items-center gap-3 ${
              isSelected
                ? "bg-gradient-to-br from-slate-800 via-slate-900 to-cyan-950/45 border-cyan-400/80 shadow-lg shadow-cyan-950/50"
                : q && matchCount > 0
                ? "bg-slate-900/90 border-emerald-500/40 hover:border-emerald-400"
                : "bg-slate-900/70 border-slate-800/80 hover:bg-slate-800/60 hover:border-slate-700"
            }"
          >
            ${isSelected ? `<span class="absolute inset-x-3 bottom-0 h-0.5 rounded-t-full bg-cyan-400"></span>` : ""}
            ${renderStoreArtwork(store, "w-14 h-12", "text-xs")}
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-1.5">
                <span class="font-bold text-xs sm:text-sm tracking-tight text-slate-100 truncate group-hover:text-cyan-200 transition">${store.name}</span>
                <span class="text-[10px] font-mono px-1.5 py-0.5 rounded-md bg-slate-950/90 border border-slate-800 text-slate-300 shrink-0">Lv.${store.unlockLv}</span>
              </div>
              <div class="flex items-center justify-between text-[11px] text-slate-400 mt-1">
                <span class="truncate">${store.group}</span>
                <span class="shrink-0 ml-1.5 ${q && matchCount > 0 ? "text-emerald-400 font-semibold" : "text-slate-400"}">
                  ${q ? `${matchCount} match${matchCount === 1 ? "" : "es"}` : `${store.items.length} items`}
                </span>
              </div>
            </div>
          </button>
        `;
      }).join("");
    }

    function renderItems() {
      const currentStarObj = STAR_LEVELS.find(s => s.id === activeStar);
      const q = searchQuery.toLowerCase();
      const bannerEl = document.getElementById("selectedStoreBanner");
      const gridEl = document.getElementById("itemGrid");

      let displayEntries = [];

      if (q) {
        const visibleStores = getVisibleStores();
        visibleStores.forEach(st => {
          st.items.forEach(item => {
            if (itemMatches(item, q)) {
              displayEntries.push({ item, store: st });
            }
          });
        });

        const scopeNote = includeIngredients ? "Item Names + Ingredients" : "Item Names Only";

        bannerEl.innerHTML = `
          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-2">
            <div>
              <span class="text-[11px] uppercase tracking-wider font-semibold text-emerald-400">Search (${scopeNote} • ${activeGroup})</span>
              <h2 class="text-xl font-bold text-white">Matches for "${searchQuery.replace(/</g, "&lt;")}"</h2>
            </div>
            <div class="flex items-center gap-3 text-xs text-slate-400">
              <span>${displayEntries.length} item${displayEntries.length === 1 ? "" : "s"} found</span>
              <button onclick="clearSearch()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium transition">Reset</button>
            </div>
          </div>
        `;
      } else {
        const store = STORES.find(s => s.id === selectedStoreId) || STORES[0];
        displayEntries = store.items.map(item => ({ item, store }));

        bannerEl.innerHTML = `
          <div class="relative overflow-hidden bg-gradient-to-br from-slate-900/95 via-slate-900 to-cyan-950/25 border border-slate-800/90 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-xl">
            <div class="flex items-center gap-4">
              ${renderStoreArtwork(store, "w-20 h-16 sm:w-24 sm:h-20", "text-base")}
              <div>
                <div class="flex flex-wrap items-center gap-2 mb-1">
                  <span class="text-[11px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-md bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">${store.group}</span>
                  <span class="text-xs font-mono text-slate-400">Unlock Lv.${store.unlockLv}</span>
                </div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">${store.name}</h2>
                <p class="text-xs text-slate-400 mt-1">Build Cost: <span class="text-amber-300 font-semibold">${store.buildCost}</span> • ${store.items.length} producible items</p>
              </div>
            </div>
            <div class="sm:text-right bg-slate-950/75 border border-slate-800/90 rounded-xl px-3.5 py-2.5 shrink-0">
              <span class="block text-[10px] uppercase tracking-wider text-slate-500">Active Speed Tier</span>
              <span class="text-sm font-bold text-amber-300">${currentStarObj.label}</span>
            </div>
          </div>
        `;
      }

      if (displayEntries.length === 0) {
        gridEl.innerHTML = `
          <div class="col-span-full bg-slate-900/70 border border-slate-800 rounded-2xl p-8 text-center">
            <p class="text-slate-300 font-medium">No ${includeIngredients ? "items or ingredients" : "item names"} matched "${searchQuery.replace(/</g, "&lt;")}".</p>
            <p class="text-xs text-slate-500 mt-1">${includeIngredients ? "Try another keyword or switch category filter above." : "Try checking 'Include ingredients' if you're searching for a material."}</p>
          </div>
        `;
        return;
      }

      gridEl.innerHTML = displayEntries.map(({ item, store }) => {
        const itemKey = `${store.id}::${item.name}`;
        const isOpen = expandedItemKey === itemKey;
        const hasTime = item.mins > 0;
        const hasStats = item.price > 0 && hasTime;

        const adjMins = getAdjustedMins(item.mins, currentStarObj.reduction);
        const rateText = hasStats ? `§${(item.price / adjMins).toFixed(2)}/m` : "Needs check";
        const timeText = formatDuration(item.mins, currentStarObj.reduction);
        const priceText = item.price > 0 ? `§${item.price.toLocaleString()}` : "—";

        const starBreakdownHtml = STAR_LEVELS.map(st => {
          const isCurrent = st.id === activeStar;
          const stTime = formatDuration(item.mins, st.reduction);
          const stMins = getAdjustedMins(item.mins, st.reduction);
          const stRate = hasStats ? `§${(item.price / stMins).toFixed(2)}/m` : "—";

          return `
            <div class="rounded-lg p-2 text-center border ${
              isCurrent
                ? "bg-amber-500/15 border-amber-400/60"
                : "bg-slate-950/80 border-slate-800"
            }">
              <div class="text-[10px] font-semibold ${isCurrent ? "text-amber-300" : "text-slate-400"}">${st.short}</div>
              <div class="font-mono text-xs font-bold text-white mt-0.5">${stTime}</div>
              <div class="font-mono text-[10px] text-emerald-400 mt-0.5">${stRate}</div>
            </div>
          `;
        }).join("");

        return `
          <div onclick="toggleItem('${itemKey.replace(/'/g, "\\'")}')" class="item-card cursor-pointer bg-slate-900/90 hover:bg-slate-800/80 border ${
            isOpen ? "border-cyan-400" : "border-slate-800/90"
          } rounded-2xl p-4 transition select-none">
            <div class="flex items-start justify-between gap-2.5">
              <div class="flex items-center gap-3 min-w-0">
                ${renderItemArtwork(item, "w-12 h-12")}
                <div class="min-w-0">
                  <h3 class="font-bold text-white text-base truncate">${item.name}</h3>
                  <div class="flex flex-wrap items-center gap-1.5 mt-0.5">
                    <span class="text-[11px] text-slate-400">Unlock Lv.${item.lv}</span>
                    ${q ? `<button onclick="event.stopPropagation(); selectStore('${store.id}', true)" class="text-[10px] font-semibold px-2 py-0.5 rounded bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 hover:bg-cyan-500/25 transition">${store.name}</button>` : ""}
                  </div>
                </div>
              </div>
              <span class="font-mono text-xs font-bold px-2.5 py-1 rounded-lg shrink-0 ${
                hasStats ? "bg-emerald-500/15 text-emerald-300 border border-emerald-500/30" : "bg-slate-800 text-amber-300 border border-slate-700"
              }">${rateText}</span>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-3 text-xs">
              <div class="bg-slate-950/70 rounded-xl px-3 py-2">
                <span class="text-slate-500 block text-[10px]">Max Price</span>
                <span class="font-mono font-semibold text-amber-300">${priceText}</span>
              </div>
              <div class="bg-slate-950/70 rounded-xl px-3 py-2">
                <span class="text-slate-500 block text-[10px]">Time (${currentStarObj.short})</span>
                <span class="font-mono font-semibold text-slate-200">${timeText}</span>
              </div>
            </div>

            ${isOpen ? `
              <div class="mt-3 pt-3 border-t border-slate-800 space-y-2.5">
                <div class="flex items-center gap-2.5 text-xs text-slate-300">
                  <span class="text-slate-500 shrink-0">Materials:</span>
                  <span>${item.mats}</span>
                </div>
                <div>
                  <span class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1.5">Production Time &amp; Rate by Star Level</span>
                  <div class="grid grid-cols-4 gap-1.5">
                    ${starBreakdownHtml}
                  </div>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    initStoreRowDesktopControls();
    renderStarPills();
    renderGroupPills();
    renderStores();
    renderItems();
  </script>
</body>
</html>
